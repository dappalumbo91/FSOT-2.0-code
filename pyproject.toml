[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fsot"
version = "2.0.1"
description = "FSOT — Fluid Spacetime Omni-Theory (interpretable Python runtime)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mpmath>=1.3.0"]
authors = [{ name = "Damian Arthur Palumbo" }]
license = { text = "MIT" }
keywords = ["fsot", "physics", "unified-theory", "mpmath"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Physics",
]

[project.scripts]
fsot = "fsot.cli:main"

[project.urls]
Homepage = "https://github.com/dappalumbo91/FSOT-2.0-code"
Repository = "https://github.com/dappalumbo91/FSOT-2.0-code"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["fsot-2.0"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
fsot = ["bundled_data/*.json", "bundled_data/benchmarks/*.json"]