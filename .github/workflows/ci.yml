name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  python-monolith:
    name: FSOT monolith (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FSOT
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Portable verify
        run: fsot verify --quiet

      - name: Monolith smoke tests
        run: pytest fsot-2.0/tests/test_monolith.py -q

      - name: Validation suite
        run: fsot run --validate

  julia-legacy:
    name: Julia legacy (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: "1.10"

      - name: Legacy stack status
        run: |
          echo "DataAnalysisExpert Julia MC stack is optional legacy content."
          echo "day1.jl and root Project.toml are not bundled; monolith Python CI is authoritative."
          test -f DataAnalysisExpert/test/runtests.jl
          test ! -f test/runtests.jl
          echo "Skipping Julia execute tests until legacy fixtures are restored."